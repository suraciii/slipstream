x-slipstream-container: &slipstream-container
  platform: linux/amd64
  image: ${SLIPSTREAM_IMAGE:?Set SLIPSTREAM_IMAGE to an immutable image digest}
  user: "1000:1000"
  read_only: true
  # One finite shared allocation for the Web service and the optional native
  # Photo engine that runs inside this same application container
  # (design/processing-executor.md): an engine over-run fails this container
  # instead of the host. pids_limit and OMP_NUM_THREADS bound engine worker
  # threads to the same CPU allocation; the service stop_grace_period bounds
  # engine shutdown timing before the container is killed. No Docker socket is
  # mounted: the application never starts sibling containers.
  mem_limit: 8g
  cpus: 4
  pids_limit: 512
  tmpfs:
    - /tmp/slipstream:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  environment:
    SLIPSTREAM_LIBRARY_ROOT: ${SLIPSTREAM_LIBRARY_ROOT:?Set SLIPSTREAM_LIBRARY_ROOT to the Originals directory}
    SLIPSTREAM_STATE_DIRECTORY: ${SLIPSTREAM_STATE_DIRECTORY:?Set SLIPSTREAM_STATE_DIRECTORY to the application state directory}
    SLIPSTREAM_CACHE_DIRECTORY: ${SLIPSTREAM_CACHE_DIRECTORY:?Set SLIPSTREAM_CACHE_DIRECTORY to the derivative cache directory}
    SLIPSTREAM_DATABASE_BASENAME: ${SLIPSTREAM_DATABASE_BASENAME:-library.sqlite}
    SLIPSTREAM_PUBLIC_ORIGIN: ${SLIPSTREAM_PUBLIC_ORIGIN:-http://localhost:${SLIPSTREAM_PORT:-3000}}
    SLIPSTREAM_ACCESS_ORIGINS: ${SLIPSTREAM_ACCESS_ORIGINS:?launcher-generated internal access origins}
    SLIPSTREAM_WEB_ROOT: /app/web
    SLIPSTREAM_HOST: 0.0.0.0
    SLIPSTREAM_PORT: 3000
    HOME: /home/slipstream
    TMPDIR: /tmp/slipstream
    # Finite retained-output allowance for published Development TIFF
    # artifacts; the default keeps a default local deployment usable without
    # extra operator configuration.
    SLIPSTREAM_EXPORT_RETAINED_OUTPUT_BYTES: ${SLIPSTREAM_EXPORT_RETAINED_OUTPUT_BYTES:-8589934592}
    SLIPSTREAM_PHOTO_DEVELOPMENT: ${SLIPSTREAM_PHOTO_DEVELOPMENT:-auto}
    SLIPSTREAM_PHOTO_BUNDLE_DIRECTORY: ${SLIPSTREAM_PHOTO_BUNDLE_DIRECTORY:-/opt/slipstream-photo}
    OMP_NUM_THREADS: "4"
  volumes:
    - type: bind
      source: ${SLIPSTREAM_LIBRARY_ROOT:?Set SLIPSTREAM_LIBRARY_ROOT to the Originals directory}
      target: ${SLIPSTREAM_LIBRARY_ROOT:?Set SLIPSTREAM_LIBRARY_ROOT to the Originals directory}
      read_only: true
    - type: bind
      source: ${SLIPSTREAM_STATE_DIRECTORY:?Set SLIPSTREAM_STATE_DIRECTORY to the application state directory}
      target: ${SLIPSTREAM_STATE_DIRECTORY:?Set SLIPSTREAM_STATE_DIRECTORY to the application state directory}
    - type: bind
      source: ${SLIPSTREAM_CACHE_DIRECTORY:?Set SLIPSTREAM_CACHE_DIRECTORY to the derivative cache directory}
      target: ${SLIPSTREAM_CACHE_DIRECTORY:?Set SLIPSTREAM_CACHE_DIRECTORY to the derivative cache directory}

services:
  slipstream:
    <<: *slipstream-container
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "${SLIPSTREAM_BIND_ADDRESS:-127.0.0.1}:${SLIPSTREAM_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:3000/healthz",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  slipstream-admin:
    <<: *slipstream-container
    profiles:
      - access-admin
    logging:
      driver: none
