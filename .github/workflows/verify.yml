name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # This job never sets RUST_BACKTRACE, so nothing reads debug
      # information. Leaving it out shortens compilation and linking and
      # keeps the Rust cache near 220 MB compressed instead of 530 MB.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The file-size ratchet resolves its base as HEAD^1 here, so the
          # checkout must carry the merge commit and its parents.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy,rustfmt
      - name: Restore Rust dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-verify-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-verify-${{ runner.os }}-
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential ca-certificates curl libexiv2-dev libglib2.0-dev \
            libjpeg-dev liblcms2-dev liblensfun-dev libopenblas-dev libvips-dev \
            pkg-config
          prefix="$RUNNER_TEMP/libraw-022"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/LibRaw-0.22.2.tar.gz" \
            https://www.libraw.org/data/LibRaw-0.22.2.tar.gz
          echo "de86b035655accff8d4010f1a221fdf50d353cb7b1422ba26f14a0db92612cfa  $RUNNER_TEMP/LibRaw-0.22.2.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/LibRaw-0.22.2.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/LibRaw-0.22.2"
          ./configure \
            --prefix="$prefix" \
            --disable-static \
            --disable-examples \
            --disable-openmp \
            --disable-lcms
          make -j"$(nproc)"
          make install
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pkg-config --atleast-version=0.22.0 libraw libraw_r
          {
            printf 'PKG_CONFIG_PATH=%s\n' "$PKG_CONFIG_PATH"
            printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: Verify Docker Compose config capability
        run: |
          timeout -k 10s 30s docker compose version
          timeout -k 10s 30s docker compose config --help | grep -Fq -- "--format"
      - run: bun run verify
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
