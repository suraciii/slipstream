name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Use the same compiler profile for cache restoration and native verification.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The file-size ratchet resolves its base as HEAD^1 here, so the
          # checkout must carry the merge commit and its parents.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify Docker Compose config capability
        run: |
          timeout -k 10s 30s docker compose version
          timeout -k 10s 30s docker compose config --help | grep -Fq -- "--format"
      - name: Run lightweight verification before native setup
        run: bun run verify:light
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy,rustfmt
      - name: Restore Rust dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-verify-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-verify-${{ runner.os }}-
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Fail rather than install against partial package metadata.
          sudo apt-get update --error-on=any
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl libexiv2-dev libglib2.0-dev \
            libjpeg-dev liblcms2-dev liblensfun-dev libopenblas-dev \
            libopenimageio-dev libvips-dev \
            pkg-config
      - run: bun x playwright install --with-deps chromium
      - name: Resolve native environment inputs
        id: native-environment
        shell: bash
        run: |
          set -euo pipefail
          native="$({
            printf 'prefix=%s/libraw-022\n' "$RUNNER_TEMP"
            dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort
          } | sha256sum | cut -d ' ' -f1)"
          {
            echo "image=${ImageOS:?}-${ImageVersion:?}"
            echo "native=$native"
          } >> "$GITHUB_OUTPUT"
      - name: Restore LibRaw installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libraw-022
          key: libraw-verify-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-environment.outputs.image }}-${{ steps.native-environment.outputs.native }}-${{ hashFiles('scripts/prepare-ci-libraw.sh') }}
      - name: Prepare and verify LibRaw installation
        run: scripts/prepare-ci-libraw.sh
      - name: Resolve Film artifact inputs
        id: film-artifact
        shell: bash
        run: |
          set -euo pipefail
          key="$(sudo -u "$(id -un)" env "PATH=$PATH" \
            "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            "ImageOS=${ImageOS:?}" "ImageVersion=${ImageVersion:?}" \
            CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
            CARGO_INCREMENTAL=0 CI=true GITHUB_ACTIONS=true \
            python3 scripts/build-spektrafilm.py --cache-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore Film executable artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/film-artifact
          key: film-artifact-${{ runner.os }}-${{ runner.arch }}-${{ steps.film-artifact.outputs.key }}
      - name: Run native verification with finite processing memory
        run: |
          sudo systemd-run --scope --quiet -p MemoryMax=6G \
            sudo -u "$(id -un)" env "PATH=$PATH" \
            "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            "SLIPSTREAM_CI_FILM_ARTIFACT=$RUNNER_TEMP/film-artifact" \
            "ImageOS=${ImageOS:?}" "ImageVersion=${ImageVersion:?}" \
            CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
            CARGO_INCREMENTAL=0 CI=true GITHUB_ACTIONS=true bun run verify:native
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
