name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install --yes libraw-dev libjpeg-dev libvips-dev liblcms2-dev pkg-config
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: Verify Docker Compose config capability
        run: |
          timeout -k 10s 30s docker compose version
          timeout -k 10s 30s docker compose config --help | grep -Fq -- "--format"
      - run: bun run verify
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
