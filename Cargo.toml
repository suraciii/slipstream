[workspace]
members = ["crates/slipstream-compat", "crates/slipstream-core", "crates/slipstream-server"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "=1.11.1"
http = "=1.4.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
lcms2 = { version = "=6.1.1", default-features = false }
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
cc = "=1.4.4"
pkg-config = "=0.3.32"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
