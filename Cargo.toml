[workspace]
members = ["crates/slipstream-cli", "crates/slipstream-compat", "crates/slipstream-core", "crates/slipstream-server", "crates/slipstream-processing"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
bytes = "=1.11.1"
clap = { version = "=4.6.1", features = ["derive"] }
futures-core = "=0.3.31"
http = "=1.4.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
lcms2 = { version = "=6.1.1", default-features = false }
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
time = { version = "=0.3.44", default-features = false, features = ["formatting", "std"] }
cc = "=1.4.4"
pkg-config = "=0.3.32"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
url = "=2.5.8"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
