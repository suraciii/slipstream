[package]
name = "slipstream-cli"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "slipstream"
path = "src/main.rs"

[dependencies]
clap.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }
url.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
image.workspace = true
rusqlite.workspace = true
rustls = "=0.23.45"
rustls-pemfile = "=2.2.0"
sha2.workspace = true
slipstream-server = { path = "../slipstream-server" }
