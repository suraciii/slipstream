[package]
name = "darktable-edit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["runtime"]
inspection = ["dep:rusqlite", "dep:photo-files"]
runtime = ["inspection", "dep:sha2", "dep:image", "dep:jsonschema", "dep:time"]
[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
libc.workspace = true
photo-files = { path = "../photo-files", optional = true }

image = { workspace = true, features = ["png", "tiff"], optional = true }
jsonschema = { version = "=0.33.0", default-features = false, optional = true }
time = { workspace = true, features = ["parsing"], optional = true }
[[bin]]
name = "darktable-edit"
path = "src/main.rs"
required-features = ["runtime"]

[[bin]]
name = "darktable-edit-supervisor"
path = "src/bin/darktable-edit-supervisor.rs"
required-features = ["runtime"]
